name: Test

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'website/*'
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'website/*'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
      id: go

    - name: Run linters
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.1

    - name: Generate
      # setup-go pins GOTOOLCHAIN=local, but tfplugindocs needs a newer Go than
      # the one go.mod declares. Let this one step fetch the toolchain it asks
      # for instead of raising the module's own Go version.
      env:
        GOTOOLCHAIN: auto
      run: make generate

    - name: Confirm no diff
      run: |
        git diff --compact-summary --exit-code || \
          (echo "*** Unexpected differences after code generation. Run 'make generate' and commit."; exit 1)

    - name: Build
      run: make build

  test:
    name: 'Acc. Tests (Loki ${{ matrix.loki-version }} / TF ${{ matrix.terraform }} / ${{ matrix.os }})'
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        terraform:
          - '1.5.7'
        # 3.6.x and 3.7.x are the only actively patched lines; 2.9.17 is kept as
        # a best-effort check on the last 2.x release.
        loki-version:
          - '2.9.17'
          - '3.5.12'
          - '3.6.15'
          - '3.7.6'
        # Guard against Terraform-side regressions without multiplying the matrix.
        include:
          - os: ubuntu-latest
            terraform: '1.15.9'
            loki-version: '3.7.6'
    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Setup Terraform ${{ matrix.terraform }}
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ matrix.terraform }}
        terraform_wrapper: false

    - name: TF acceptance tests
      timeout-minutes: 10
      env:
        TF_ACC: "1"
        LOKI_URI: "http://localhost:3100"
      run: |
        LOKI_VERSION=${{ matrix.loki-version }} make testacc

    - name: Dump docker logs on failure
      if: failure()
      uses: jwalton/gh-docker-logs@v2.2.2
